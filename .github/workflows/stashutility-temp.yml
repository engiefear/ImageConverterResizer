name: Temporary custom StashUtility build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile build harness
        uses: actions/checkout@v4
        with:
          ref: stashutility-build
          path: harness

      - name: Checkout GameHelper2
        uses: actions/checkout@v4
        with:
          repository: AlexanderHel/GameHelper2
          path: GameHelper2

      - name: Checkout current StashUtility
        uses: actions/checkout@v4
        with:
          repository: AlexanderHel/StashUtility
          path: GameHelper2/Plugins/StashUtility

      - name: Apply profile-engine patch
        run: python3 harness/stashutility-ci/apply_profile_patch.py

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build GameHelper2/Plugins/StashUtility/StashUtility.csproj -c Release

      - name: Package plugin
        run: |
          mkdir -p artifact/StashUtility/profiles/waystones artifact/StashUtility/profiles/tablets artifact/StashUtility/profiles/jewels
          cp GameHelper2/Plugins/StashUtility/bin/Release/net10.0-windows/win-x64/StashUtility.dll artifact/StashUtility/
          cp GameHelper2/Plugins/StashUtility/bin/Release/net10.0-windows/win-x64/StashUtility.pdb artifact/StashUtility/ || true
          cp -r GameHelper2/Plugins/StashUtility/Data artifact/StashUtility/ || true
          cp -r GameHelper2/Plugins/StashUtility/Localization artifact/StashUtility/ || true
          printf '%s\n' 'Custom StashUtility profile build' > artifact/StashUtility/PROFILE_BUILD.txt
          cd artifact && zip -r ../StashUtility-Profiled.zip StashUtility

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StashUtility-Profiled
          path: StashUtility-Profiled.zip
          if-no-files-found: error
